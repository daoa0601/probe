[experiment]
name = "gemma4-26b-a4b-thread-sweep"
description = "Compare performance-core-only and mixed-core thread counts."
output_dir = "results"
tags = ["gemma4", "26b-a4b", "threads", "metal"]

[model]
label = "Gemma 4 26B-A4B IT QAT"
hf_repo = "google/gemma-4-26B-A4B-it-qat-q4_0-gguf"
hf_file = "gemma-4-26B_q4_0-it.gguf"
quantization = "QAT Q4_0"

[runtime]
binary = "llama-bench"
repetitions = 5
delay_seconds = 1
warmup = true
offline = false
capture_peak_memory = true
timeout_seconds = 7200

[workload]
prompt_tokens = [512, 4096]
generation_tokens = [128]
combined = []

[matrix]
batch_sizes = [2048]
ubatch_sizes = [512]
threads = [8, 10, 14]
gpu_layers = [99]
cpu_moe_layers = [0]
flash_attention = ["on"]
cache_type_k = ["f16"]
cache_type_v = ["f16"]
mmap = [true]
no_kv_offload = [false]
