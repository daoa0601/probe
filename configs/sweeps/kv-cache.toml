[experiment]
name = "gemma4-26b-a4b-kv-cache-sweep"
description = "Measure KV precision throughput before long-context memory and quality checks."
output_dir = "results"
tags = ["gemma4", "26b-a4b", "kv-cache", "metal"]

[model]
label = "Gemma 4 26B-A4B IT"
hf_repo = "ggml-org/gemma-4-26B-A4B-it-GGUF"
hf_file = "gemma-4-26B-A4B-it-Q4_0.gguf"
quantization = "Q4_0"

[runtime]
binary = "llama-bench"
repetitions = 5
delay_seconds = 1
warmup = true
offline = false
capture_peak_memory = true
timeout_seconds = 10800

[workload]
prompt_tokens = [4096]
generation_tokens = [128]
combined = []

[matrix]
batch_sizes = [2048]
ubatch_sizes = [512]
threads = [10]
gpu_layers = [99]
cpu_moe_layers = [0]
flash_attention = ["on"]
cache_type_k = ["f16", "q8_0", "q4_0"]
cache_type_v = ["f16", "q8_0", "q4_0"]
mmap = [true]
no_kv_offload = [false]
