[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "probe-inference"
version = "0.1.0"
description = "Reproducible local inference optimization experiments for Gemma 4 on Apple Silicon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Anh Dao" }]
dependencies = [
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.31,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
probe = "probe.cli:app"

[tool.uv.build-backend]
module-name = "probe"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache", "models", "reports", "results"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["probe"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false

[tool.coverage.run]
branch = true
source = ["probe"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
